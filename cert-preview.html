<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>용용타자 — 인증서 4종 미리보기</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  @font-face { font-family: 'DNFBitBit'; src: url('/assets/fonts/DNFBitBitv2.subset.woff2') format('woff2'); }
  @font-face { font-family: 'Galmuri11'; src: url('/assets/fonts/Galmuri11-Bold.subset.woff2') format('woff2'); font-weight: 700; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 28px 20px 40px; color: #fff; word-break: keep-all;
    font-family: 'Galmuri11', 'Noto Sans KR', sans-serif; background: linear-gradient(180deg, #6c4fa3, #272052) fixed; }
  h1 { margin: 0 0 6px; text-align: center; font-family: 'DNFBitBit', sans-serif; font-weight: 400; font-size: 34px; text-shadow: 0 4px 0 rgba(20,12,60,.45); }
  p.sub { margin: 0 0 24px; text-align: center; color: #d8d5ea; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 560px)); gap: 22px; justify-content: center; }
  @media (max-width: 1180px) { .grid { grid-template-columns: minmax(0, 560px); } }
  .card { background: #fff; border-radius: 24px; padding: 14px; box-shadow: 0 9px 0 #d8d5ea; color: #272052; }
  .card h2 { margin: 2px 6px 10px; font-family: 'DNFBitBit', sans-serif; font-weight: 400; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
  .card h2 small { font-family: 'Galmuri11', sans-serif; font-size: 14px; color: #8a83b0; }
  .frame { position: relative; width: 100%; aspect-ratio: 1000 / 780; overflow: hidden; border-radius: 16px; background: #272052; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1000px; height: 780px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .card a { display: inline-block; margin-top: 10px; padding: 8px 18px; border-radius: 100px; background: #f4f2fb; color: #272052; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <h1>인증서 미리보기</h1>
  <p class="sub">점수에 따라 받는 인증서 · 초보자 1만 · 중급자 5만 · 고수 50만 · 달인 500만</p>
  <div class="grid">
    <div class="card"><h2>도전 기록 <small>10,000점 미만</small></h2><div class="frame"><iframe src="antigravity-korean.html?cert=try" loading="lazy"></iframe></div><a href="antigravity-korean.html?cert=try" target="_blank">크게 보기 →</a></div>
    <div class="card"><h2>초보자 <small>10,000점</small></h2><div class="frame"><iframe src="antigravity-korean.html?cert=beginner" loading="lazy"></iframe></div><a href="antigravity-korean.html?cert=beginner" target="_blank">크게 보기 →</a></div>
    <div class="card"><h2>중급자 <small>50,000점</small></h2><div class="frame"><iframe src="antigravity-korean.html?cert=intermediate" loading="lazy"></iframe></div><a href="antigravity-korean.html?cert=intermediate" target="_blank">크게 보기 →</a></div>
    <div class="card"><h2>고수 <small>500,000점</small></h2><div class="frame"><iframe src="antigravity-korean.html?cert=advanced" loading="lazy"></iframe></div><a href="antigravity-korean.html?cert=advanced" target="_blank">크게 보기 →</a></div>
    <div class="card"><h2>달인 <small>5,000,000점</small></h2><div class="frame"><iframe src="antigravity-korean.html?cert=master" loading="lazy"></iframe></div><a href="antigravity-korean.html?cert=master" target="_blank">크게 보기 →</a></div>
  </div>
<script>
  // 각 칸 너비에 맞춰 1000×780 게임 화면을 축소
  function fit() { document.querySelectorAll('.frame').forEach(f => { f.querySelector('iframe').style.transform = `scale(${f.clientWidth / 1000})`; }); }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
